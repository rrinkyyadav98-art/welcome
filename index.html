<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyborg Nexus - Next Gen AI</title>
    <!-- Google Fonts को जोड़ा गया है ताकि फॉन्ट अच्छे से काम करें -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cyber Grid Background Overlay -->
    <div class="grid-overlay"></div>

    <!-- Navigation Header -->
    <header>
        <div class="logo">CYBORG<span>_NEXUS</span></div>
        <nav>
            <a href="#home">Home</a>
            <a href="#features">Core</a>
            <a href="#system">System</a>
        </nav>
    </header>

    <!-- Main Hero Section -->
    <section class="hero" id="home">
        <div class="hero-content">
            <span class="badge">SYSTEM ONLINE [V3.0]</span>
            <h1>HUMANITY_ <br><span class="neon-text">UPGRADED.</span></h1>
            <p>Experience the future of human-machine fusion with Cyborg Nexus. Connect your neural interface directly to the global quantum grid.</p>
            <div class="btn-group">
                <!-- इस बटन को दबाते ही आवाज़ आएगी -->
                <button class="btn-primary" onclick="initiateSystem()">SYSTEM INITIATE</button>
                <button class="btn-secondary">LEARN MORE</button>
            </div>
        </div>
        <div class="hero-image">
            <div class="cyborg-core"></div>
        </div>
    </section>

    <!-- स्क्रिप्ट फ़ाइल का लिंक -->
    <script src="script.js"></script>
</body>
</html>
